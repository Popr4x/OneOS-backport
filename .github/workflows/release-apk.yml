# Builds the OneOS APKs (full and probe editions) and uploads them to a GitHub
# release named after the app's versionName (app-android/app/build.gradle.kts).
#
# Runs on every push to main, on v* tags, and by hand (Actions > Release APK >
# Run workflow). A release that already exists for the version gets its APKs
# replaced.
#
# Signing (app-android/README.md, "Build"). The APKs are always release builds.
# With these repository secrets they are signed with your own key:
#   ONEOS_KEYSTORE_BASE64   base64 of the .jks (base64 -w0 oneos-release.jks)
#   ONEOS_KEYSTORE_PASSWORD store password
#   ONEOS_KEY_ALIAS         key alias
#   ONEOS_KEY_PASSWORD      key password
# Without them the workflow makes a key on its first run and keeps it in the
# Actions cache (oneos-ci-release-key-v1), so later builds are signed with the
# same key and update each other. GitHub drops a cache entry that is unused
# for 7 days: after such a gap a new key is made, and installed apps must be
# uninstalled before the next update installs. Set the secrets to avoid that.
name: Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app-android
    env:
      HAS_KEY_SECRET: ${{ secrets.ONEOS_KEYSTORE_BASE64 != '' }}
      GH_PACKAGES_USER: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image has the Android SDK (ANDROID_HOME) with its licenses accepted;
      # AGP downloads the platform and build tools it needs. android-actions/setup-android
      # failed here: it asks sdkmanager for the old "tools" package, which is gone.
      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\([0-9.]*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts | head -n 1)
          [ -n "$name" ] && [ -n "$code" ] || { echo "no versionName/versionCode in app/build.gradle.kts"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "OneOS $name ($code)"

      - name: Restore the workflow's own key
        id: cached-key
        if: ${{ env.HAS_KEY_SECRET != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.oneos-release
          key: oneos-ci-release-key-v1

      - name: Set up the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEOS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ONEOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONEOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONEOS_KEY_PASSWORD }}
        run: |
          dir="$HOME/.oneos-release"
          mkdir -p "$dir" && chmod 700 "$dir"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with the key from the repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/oneos-release.jks"
            {
              echo "storeFile=$dir/oneos-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$dir/keystore.properties"
          elif [ -f "$dir/keystore.properties" ] && [ -f "$dir/oneos-release.jks" ]; then
            echo "Signing with the workflow's own key (from the Actions cache)."
          else
            echo "No key secrets and no cached key: making the workflow's own key."
            pass=$(openssl rand -hex 24)
            keytool -genkeypair -noprompt -keystore "$dir/oneos-release.jks" -storetype JKS \
              -alias oneos -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=OneOS backport CI"
            {
              echo "storeFile=$dir/oneos-release.jks"
              echo "storePassword=$pass"
              echo "keyAlias=oneos"
              echo "keyPassword=$pass"
            } > "$dir/keystore.properties"
          fi
          chmod 600 "$dir/oneos-release.jks" "$dir/keystore.properties"
          keytool -list -v -keystore "$dir/oneos-release.jks" \
            -storepass "$(sed -n 's/^storePassword=//p' "$dir/keystore.properties")" | grep -m1 "SHA256:"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullRelease assembleProbeRelease

      - name: Collect the APKs
        run: |
          v=${{ steps.version.outputs.name }}
          t=release
          mkdir -p ../out
          cp "app/build/outputs/apk/full/$t/app-full-$t.apk" "../out/OneOS-$v.apk"
          cp "app/build/outputs/apk/probe/$t/app-probe-$t.apk" "../out/OneOS-Probe-$v.apk"
          python3 ../scripts/check-staging-apk.py "../out/OneOS-$v.apk"
          (cd ../out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: OneOS-${{ steps.version.outputs.name }}
          path: out/*

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          target_commitish: ${{ github.sha }}
          name: OneOS ${{ steps.version.outputs.name }}
          generate_release_notes: true
          overwrite_files: true
          files: out/*
